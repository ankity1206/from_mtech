<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Replacement Visualizer</title>

<style>
    body {
        background-color: #0f0d0e;
        color: #00FEFE;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    .container {
        margin-top: 40px;
    }

    input, select {
        padding: 8px;
        margin: 10px;
        background: black;
        color: cyan;
        border: 1px solid cyan;
    }

    button {
        padding: 10px 20px;
        margin: 10px;
        background: black;
        color: cyan;
        border: 2px solid cyan;
        cursor: pointer;
    }

    button:hover {
        background: cyan;
        color: black;
    }

    table {
        margin: 30px auto;
        border-collapse: collapse;
    }

    td, th {
        border: 1px solid cyan;
        padding: 10px;
    }

    .hit {
        background-color: green;
        color: white;
    }

    .miss {
        background-color: red;
        color: white;
    }
</style>
</head>

<body>

<div class="container">
    <h1>Page Replacement Visualizer</h1>

    <div>
        <input type="text" id="input_string" placeholder="e.g. 7 0 1 2 0 3 0 4">
        <input type="number" id="frame_size" placeholder="Frames">
        
        <select id="algorithm">
            <option value="">Select Algorithm</option>
            <option value="FIFO">FIFO</option>
            <option value="Optimal">Optimal</option>
            <option value="LRU">LRU</option>
        </select>
    </div>

    <button onclick="visualize()">Visualize</button>
    <button onclick="resetPage()">Reset</button>

    <div id="output"></div>

    <div id="summary"></div>
</div>

<script>
function visualize() {
    let input = document.getElementById("input_string").value;
    let framesCount = parseInt(document.getElementById("frame_size").value);
    let algo = document.getElementById("algorithm").value;

    if (!input || !framesCount || !algo) {
        alert("Fill all fields");
        return;
    }

    let pages = input.split(" ").map(Number);
    let frames = Array(framesCount).fill(null);

    let hits = 0, faults = 0;
    let output = "<table><tr><th>Page</th>";

    for (let i = 0; i < framesCount; i++) {
        output += `<th>Frame ${i+1}</th>`;
    }
    output += "<th>Status</th></tr>";

    let pointer = 0;
    let time = [];

    for (let i = 0; i < pages.length; i++) {
        let page = pages[i];
        let hit = frames.includes(page);

        output += `<tr><td>${page}</td>`;

        if (hit) {
            hits++;
        } else {
            faults++;

            if (algo === "FIFO") {
                frames[pointer] = page;
                pointer = (pointer + 1) % framesCount;
            }

            else if (algo === "Optimal") {
                let future = frames.map(f =>
                    pages.slice(i+1).indexOf(f)
                );

                let idx = future.indexOf(-1);
                if (idx === -1) {
                    idx = future.indexOf(Math.max(...future));
                }
                frames[idx] = page;
            }

            else if (algo === "LRU") {
                if (!time.length) time = Array(framesCount).fill(0);

                let lruIndex = time.indexOf(Math.min(...time));
                frames[lruIndex] = page;
                time[lruIndex] = i;
            }
        }

        frames.forEach(f => {
            output += `<td>${f !== null ? f : "-"}</td>`;
        });

        output += `<td class="${hit ? "hit" : "miss"}">${hit ? "Hit" : "Miss"}</td></tr>`;
    }

    output += "</table>";
    document.getElementById("output").innerHTML = output;

    let hitRate = (hits / pages.length * 100).toFixed(2);
    let missRate = (faults / pages.length * 100).toFixed(2);

    document.getElementById("summary").innerHTML = `
        <p>Page Faults: <b>${faults}</b></p>
        <p>Page Hits: <b>${hits}</b></p>
        <p>Hit Rate: <b>${hitRate}%</b></p>
        <p>Miss Rate: <b>${missRate}%</b></p>
    `;
}

function resetPage() {
    location.reload();
}
</script>

</body>
</html>
